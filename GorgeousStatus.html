<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>少女成长手札 · 最新华丽版</title>
<style>
:root,
[data-theme="light"] {
  --pm-bg:#fff7f0;
  --pm-paper:#fffdf8;
  --pm-paper-soft:#fff1eb;
  --pm-border:#e7b6c2;
  --pm-border-deep:#c9899b;
  --pm-rose:#d77c94;
  --pm-rose-soft:#f6d2db;
  --pm-blue:#7ea7c8;
  --pm-blue-soft:#d9e9f5;
  --pm-gold:#cda45b;
  --pm-gold-soft:#f3dfb2;
  --pm-ink:#5a3f46;
  --pm-muted:#967984;
  --pm-white:#fffaf6;
  --pm-shadow:0 16px 34px rgba(175,109,132,.25);
  --pm-card:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,248,244,.9));
  --pm-header:linear-gradient(135deg,#f8ccd5 0%,#fee9dd 48%,#dcecf7 100%);
  --pm-bar:linear-gradient(90deg,#d77c94,#cda45b);
  --pm-rebel:linear-gradient(90deg,#86aed0,rgba(255,255,255,.9),#d77c94);
}
[data-theme="dark"] {
  --pm-bg:#2A232B;
  --pm-paper:#3A313B;
  --pm-paper-soft:#453844;
  --pm-border:#80616A;
  --pm-border-deep:#B0838E;
  --pm-rose:#C79AAA;
  --pm-rose-soft:#60434E;
  --pm-blue:#8FA1B6;
  --pm-blue-soft:#344253;
  --pm-gold:#D4BC86;
  --pm-gold-soft:#6B5735;
  --pm-ink:#F0E4D8;
  --pm-muted:#C7B3A8;
  --pm-white:#332A33;
  --pm-shadow:0 16px 34px rgba(0,0,0,.45);
  --pm-card:linear-gradient(180deg,rgba(65,54,65,.96),rgba(49,41,50,.94));
  --pm-header:linear-gradient(135deg,#5E4652 0%,#3C313B 48%,#313D4B 100%);
  --pm-bar:linear-gradient(90deg,#C79AAA,#D4BC86);
  --pm-rebel:linear-gradient(90deg,#8FA1B6,rgba(255,255,255,.14),#C79AAA);
}

*{box-sizing:border-box;}
.pm-diary-root{
  font-family:"Microsoft YaHei","Hiragino Sans GB","Yu Gothic",serif;
  width:100%;
  max-width:980px;
  margin:0 auto;
  color:var(--pm-ink);
}

.pm-diary{
  position:relative;
  overflow:hidden;
  border-radius:26px;
  border:3px double var(--pm-border);
  box-shadow:var(--pm-shadow);
  background:
    linear-gradient(90deg,rgba(193,121,142,.16) 0 10px,transparent 10px calc(100% - 10px),rgba(193,121,142,.16) calc(100% - 10px)),
    radial-gradient(circle at 8% 8%,rgba(255,255,255,.75) 0 2px,transparent 3px),
    radial-gradient(circle at 92% 16%,rgba(255,255,255,.55) 0 2px,transparent 3px),
    linear-gradient(180deg,var(--pm-bg),var(--pm-paper-soft));
}
[data-theme="dark"] .pm-diary {
  background:
    linear-gradient(90deg,rgba(20,16,23,.28) 0 10px,transparent 10px calc(100% - 10px),rgba(20,16,23,.28) calc(100% - 10px)),
    radial-gradient(circle at 8% 8%,rgba(212,188,134,.15) 0 2px,transparent 3px),
    radial-gradient(circle at 92% 16%,rgba(143,161,182,.16) 0 2px,transparent 3px),
    linear-gradient(180deg,var(--pm-bg),var(--pm-paper-soft));
}

.pm-diary::before{
  content:"";
  position:absolute;
  inset:10px;
  border:1px dashed rgba(205,164,91,.46);
  border-radius:19px;
  pointer-events:none;
  z-index:0;
}
.pm-diary::after{
  content:"❀";
  position:absolute;
  left:18px;
  bottom:12px;
  color:var(--pm-rose);
  opacity:.42;
  font-size:34px;
  pointer-events:none;
}

.pm-book{
  border:none;
  margin:0;
  padding:0;
}
.pm-book > summary{
  list-style:none;
  cursor:pointer;
  position:relative;
  z-index:1;
}
.pm-book > summary::-webkit-details-marker{display:none;}

.pm-cover{
  position:relative;
  z-index:1;
  min-height:108px;
  padding:18px 118px 15px;
  text-align:center;
  border-bottom:2px solid var(--pm-border);
  background:
    linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent),
    var(--pm-header);
  user-select:none;
}
.pm-cover::before{
  content:"";
  position:absolute;
  left:18px;
  right:18px;
  top:10px;
  height:28px;
  pointer-events:none;
  opacity:.38;
  background:
    radial-gradient(circle at 20px 12px,var(--pm-gold) 0 1px,transparent 2px),
    linear-gradient(90deg,transparent,rgba(205,164,91,.36),transparent);
}

.pm-fold-heart{
  position:absolute;
  top:6px;
  left:50%;
  transform:translateX(-50%);
  width:52px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid rgba(205,164,91,.58);
  border-top:none;
  border-radius:0 0 20px 20px;
  background:rgba(255,255,255,.38);
  color:var(--pm-gold);
  font-size:16px;
  line-height:1;
  box-shadow:0 3px 8px rgba(155,103,121,.12);
  z-index:4;
}
[data-theme="dark"] .pm-fold-heart {
  background:rgba(255,255,255,.10);
  border-color:rgba(212,188,134,.55);
}
.pm-fold-heart::before{content:"♡";}
.pm-book[open] .pm-fold-heart::before{content:"♥";}

.pm-theme{
  position:absolute;
  left:18px;
  top:18px;
  width:34px;
  height:34px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.75);
  background:rgba(255,255,255,.45);
  color:var(--pm-ink);
  cursor:pointer;
  font-size:1rem;
  z-index:6;
}
[data-theme="dark"] .pm-theme {
  background:rgba(255,255,255,.10);
  border-color:rgba(212,188,134,.55);
  color:var(--pm-gold);
}

.pm-date{
  position:absolute;
  right:18px;
  top:18px;
  width:86px;
  padding:7px 4px;
  border:2px solid rgba(205,164,91,.58);
  border-radius:16px;
  background:rgba(255,255,255,.38);
  color:var(--pm-ink);
  box-shadow:0 4px 10px rgba(155,103,121,.12);
}
[data-theme="dark"] .pm-date {
  background:rgba(255,255,255,.10);
  border-color:rgba(212,188,134,.55);
}
.pm-date-year{font-size:.7rem;color:var(--pm-muted);font-weight:900;}
.pm-date-day{font-size:1.2rem;font-weight:900;color:var(--pm-rose);line-height:1.2;}
.pm-date-week{font-size:.72rem;color:var(--pm-muted);}

.pm-subtitle{
  margin-top:18px;
  font-size:.62rem;
  letter-spacing:4px;
  color:var(--pm-muted);
  text-transform:uppercase;
}
.pm-title{
  margin-top:4px;
  font-size:1.55rem;
  font-weight:900;
  letter-spacing:5px;
  color:var(--pm-ink);
  text-shadow:0 2px 0 rgba(255,255,255,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
}
.pm-twinkle{
  color:var(--pm-rose);
  font-size:1rem;
  animation:pmTwinkle 1.75s ease-in-out infinite;
}
.pm-twinkle:last-child{animation-delay:.8s;}
@keyframes pmTwinkle{
  0%,100%{opacity:.35;transform:scale(.82) rotate(0deg);}
  50%{opacity:1;transform:scale(1.2) rotate(12deg);text-shadow:0 0 8px rgba(205,164,91,.52);}
}
.pm-ribbon{
  margin:10px auto 0;
  width:min(74%,460px);
  height:9px;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,var(--pm-rose-soft),var(--pm-blue-soft),transparent);
}

.pm-body{
  position:relative;
  z-index:1;
  padding:17px;
  background:
    radial-gradient(circle at 12% 0%,rgba(255,255,255,.45),transparent 28%),
    var(--pm-paper);
  display:grid;
  gap:18px;
}
[data-theme="dark"] .pm-body {
  background:
    radial-gradient(circle at 12% 0%,rgba(255,255,255,.06),transparent 28%),
    var(--pm-paper);
}

.section-title{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:2px auto 12px;
  width:min(310px,80%);
  height:36px;
  color:#fffaf7;
  background:linear-gradient(180deg,var(--pm-rose),var(--pm-border-deep));
  border:1px solid rgba(255,255,255,.55);
  border-radius:9px;
  box-shadow:0 4px 10px rgba(155,103,121,.18);
  font-size:1rem;
  font-weight:900;
  letter-spacing:3px;
}
[data-theme="dark"] .section-title {
  background:linear-gradient(180deg,#C995A8,#8E6071);
  color:#FFF4F7;
  border-color:rgba(212,188,134,.42);
}
.section-title::before,
.section-title::after{
  content:"✦";
  color:var(--pm-gold-soft);
  font-size:.8rem;
}

.pm-card{
  background:
    radial-gradient(circle at 0 0,rgba(255,255,255,.38),transparent 28%),
    var(--pm-card);
  border:1px solid var(--pm-border);
  border-radius:18px;
  box-shadow:0 6px 14px rgba(155,103,121,.13);
  padding:13px;
}
[data-theme="dark"] .pm-card {
  border-color:rgba(128,97,106,.85);
}

.today-panel{
  display:grid;
  grid-template-columns:128px 1fr 1fr;
  gap:14px;
  align-items:start;
}
.user-portrait{
  display:flex;
  justify-content:center;
  align-items:start;
}
/* ===== 主角头像框：日夜双相框版 ===== */

.user-avatar-frame{
  position:relative !important;
  width:126px !important;
  height:170px !important;
  padding:13px 8px 26px 12px !important;
  transform:translate(-2px, 2px);
  border:none !important;
  border-radius:0 !important;
  background:none !important;
  box-shadow:none !important;
  overflow:visible !important;
}

.user-avatar-frame::before{
  display:none !important;
}

.user-avatar-frame::after{
  content:"";
  position:absolute;
  inset:-10px -12px -18px -12px;
  background-position:center !important;
  background-size:100% 100% !important;
  background-repeat:no-repeat !important;
  pointer-events:none;
  z-index:10;
  transform:translate(4px, 4px);
  transition:background-image .35s ease, filter .35s ease;
}

[data-theme="light"] .user-avatar-frame::after{
  background-image:url("https://files.catbox.moe/kmp7us.png") !important;
  filter:drop-shadow(0 5px 10px rgba(215,124,148,.16));
}

[data-theme="dark"] .user-avatar-frame::after{
  background-image:url("https://files.catbox.moe/n8q1nl.PNG") !important;
  filter:
    drop-shadow(0 6px 12px rgba(0,0,0,.34))
    drop-shadow(0 0 10px rgba(166,132,255,.18));
}

.user-avatar.user_avatar{
  position:relative !important;
  z-index:1 !important;
  width:100% !important;
  height:100% !important;
  border:none !important;

  /* 标准维多利亚椭圆，适配日夜相框 */
  border-radius:50% / 50% !important;

  overflow:hidden !important;
  background-size:cover !important;

  /* 头像位置：脸稍微往下，不容易顶到上框 */
  background-position:center 18% !important;
}
@media(max-width:700px){
  .user-avatar-frame{
    width:126px !important;
    height:170px !important;
    padding:13px 8px 26px 12px !important;
    transform:translate(-2px, 2px);
  }

  .user-avatar-frame::after{
    inset:-10px -12px -18px -12px !important;
    transform:translate(4px, 4px);
  }
}
.info-row{
  display:grid;
  grid-template-columns: 102px 1fr !important;
  gap:8px;
  font-size:.85rem;
  line-height:1.55;
  margin-bottom:7px;
  align-items:start;
  overflow:visible;
}
.label{
  font-weight:900;
  color:var(--pm-rose);
  text-align:left !important;
  display:flex;
  align-items:center;
  white-space:nowrap;
}
.value{word-break:break-word;overflow-wrap:break-word;color:var(--pm-ink);overflow:visible;}
.gold{color:var(--pm-gold);font-weight:900;}

.icon-label::before{
  display:inline-block;
  width:22px !important;
  text-align:center;
  margin-right:6px !important;
  flex-shrink:0;
}
.label-dress::before{content:"👗";}
.label-status::before{content:"😊";}
.label-money::before{content:"🪙";}
.label-stats::before{content:"📝";}

.axis-title{
  display:grid !important;
  grid-template-columns:1fr auto 1fr !important;
  align-items:center;
  margin:4px 2px 6px !important;
  font-size:.78rem;
  color:var(--pm-muted);
}
.axis-left{
  justify-self:start;
}
.axis-right{
  justify-self:end;
}
.axis-center{
  justify-self:center;
  color:var(--pm-gold);
  font-weight:900;
  letter-spacing:1px;
  text-shadow:0 1px 2px rgba(0,0,0,.12);
}
[data-theme="dark"] .axis-center{
  color:#F0D99A;
}
.rebel-line{
  height:12px;
  border-radius:999px;
  background:var(--pm-rebel);
  border:1px solid var(--pm-border);
  position:relative;
  margin:7px 2px 8px;
}
.rebel-dot{
  position:absolute;
  top:50%;
  transform:translate(-50%,-50%);
  width:18px;
  height:18px;
  border-radius:50%;
  background:var(--pm-gold);
  border:3px solid var(--pm-white);
  box-shadow:0 2px 5px rgba(0,0,0,.18);
}
.axis-reason{
  margin:4px 2px 0;
  color:var(--pm-muted);
  font-size:.74rem;
  line-height:1.45;
  font-style:italic;
  opacity:.82;
}
.axis-reason::before{
  content:"※ ";
  color:var(--pm-gold);
  opacity:.72;
}
[data-theme="dark"] .axis-reason{
  color:rgba(199,179,168,.82);
}

.course-achievement{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}
.list{
  font-size:.78rem;
  line-height:1.45;
  color:var(--pm-muted);
}

.today-right{
  min-width:0;
  overflow:visible;
  height:auto;
}

.list-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
  color:var(--pm-ink);
  font-weight:900;
  margin-bottom:4px;
}

.list-head .head-icon{color:var(--pm-rose);}
.list-item{
  border:1px solid rgba(233,184,196,.58);
  border-radius:12px;
  background:rgba(255,255,255,.28);
  padding:8px;
  margin-bottom:6px;
}
[data-theme="dark"] .list-item {
  background:rgba(255,255,255,.08);
  border-color:rgba(212,188,134,.36);
}
.badge{
  border:1px solid var(--pm-border);
  border-radius:999px;
  padding:1px 7px;
  font-size:.68rem;
  color:var(--pm-rose);
  background:var(--pm-paper-soft);
  white-space:nowrap;
}
[data-theme="dark"] .badge,
[data-theme="dark"] .achievements .badge {
  background:linear-gradient(135deg,rgba(212,188,134,.18),rgba(143,161,182,.14));
  border-color:rgba(212,188,134,.72);
  color:#F8E7B2;
  box-shadow:0 0 8px rgba(212,188,134,.14);
}
.course-row{
  display:grid;
  grid-template-columns:42px 1fr;
  gap:7px;
  margin-bottom:4px;
}

.course-row span:last-child,
.list-item,
.list-item span{
  word-break:break-word;
  overflow-wrap:anywhere;
  white-space:normal;
  min-width:0;
}
.course-row:last-child{margin-bottom:0;}
.course-time{
  color:var(--pm-rose);
  font-weight:900;
  text-align:right;
}
.achievements{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.achievements .badge{
  font-size:.72rem;
  padding:2px 8px;
  background:linear-gradient(135deg,rgba(255,255,255,.48),rgba(255,240,232,.52));
}

.stat-row{
  display:grid;
  grid-template-columns: 54px minmax(0, 1fr) 30px !important;
  gap:7px;
  align-items:center;
  font-size:.78rem;
  margin-bottom:7px;
}
.stat-name{
  font-weight:900;
  color:var(--pm-rose);
  text-align:left !important;
  white-space:nowrap !important;
  min-width:54px !important;
  display:flex;
  align-items:center;
  justify-content:flex-start;
}
.stat-name::before{
  display:inline-block;
  width:18px;
  margin-right:3px;
  flex-shrink:0;
  text-align:center;
}
.stat-charm::before{content:"👑";}
.stat-art::before{content:"🎨";}
.stat-academic::before{content:"📖";}
.stat-combat::before{content:"⚔️";}
.stat-magic::before{content:"🪄";}
.stat-val{
  font-weight:900;
  color:var(--pm-gold);
  text-align:right;
  white-space:nowrap !important;
}
.bar{
  height:8px;
  border-radius:999px;
  background:rgba(200,137,154,.18);
  border:1px solid var(--pm-border);
  overflow:hidden;
}
.fill{height:100%;background:var(--pm-bar);border-radius:999px;}

.fortune-card{
  margin-top:10px;
  border:1px solid rgba(205,164,91,.52);
  border-radius:15px;
  padding:10px;
  background:
    radial-gradient(circle at 94% 84%,rgba(205,164,91,.16),transparent 28%),
    linear-gradient(135deg,rgba(255,255,255,.42),rgba(255,240,232,.4));
  position:relative;
}
[data-theme="dark"] .fortune-card {
  border-color:rgba(212,188,134,.42);
  background:
    radial-gradient(circle at 94% 84%,rgba(212,188,134,.14),transparent 28%),
    linear-gradient(135deg,rgba(255,255,255,.08),rgba(143,161,182,.08));
}
.fortune-card::after{
  content:"🌙";
  position:absolute;
  right:12px;
  bottom:8px;
  opacity:.55;
}
.fortune-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:5px;
  color:var(--pm-rose);
  font-weight:900;
  font-size:.82rem;
}
.fortune-stars{
  color:var(--pm-gold);
  letter-spacing:1px;
  white-space:nowrap;
}
.fortune-text{
  font-size:.78rem;
  line-height:1.5;
  color:var(--pm-muted);
  font-style:italic;
  padding-right:28px;
}

.mind-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.person-note{
  display:grid;
  grid-template-columns:82px 1fr !important;
  align-items:start;
  gap:10px;
  background:var(--pm-card);
  border:1px solid var(--pm-border);
  border-radius:16px;
  padding:10px;
  box-shadow:0 4px 10px rgba(155,103,121,.11);
  position:relative;
  overflow:hidden;
}
[data-theme="dark"] .person-note {
  border-color:rgba(128,97,106,.85);
}
.person-note::before{
  content:"✧";
  position:absolute;
  right:11px;
  top:7px;
  color:var(--pm-gold);
  opacity:.55;
}
.person-avatar{
  width:72px !important;
  height:128px !important;
  border-radius:14px !important;
  overflow:hidden;
  border:3px solid var(--pm-white);
  box-shadow:inset 0 0 0 1px rgba(205,164,91,.38),0 3px 8px rgba(0,0,0,.13);
  background:linear-gradient(180deg,var(--pm-rose-soft),var(--pm-blue-soft));
  align-self:start;
}
.person-avatar img{
  width:100% !important;
  height:100% !important;
  object-fit:cover !important;
  object-position:center top !important;
  display:block;
  filter:saturate(1.04) contrast(1.02) brightness(1.03);
  cursor:pointer;
  transition:.25s ease;
}
.person-avatar img:hover{
  transform:scale(1.05);
  filter:saturate(1.08) contrast(1.03) brightness(1.08);
}
.person-content{min-width:0;}
.person-name{
  display:inline-block;
  margin-bottom:8px;
  padding:2px 12px;
  border-radius:999px;
  background:var(--pm-rose);
  color:#fff;
  font-weight:900;
  font-size:.92rem;
  letter-spacing:1px;
}
[data-theme="dark"] .person-name {
  background:linear-gradient(180deg,#E9D4DD,#CFAAB9);
  color:#2B2028;
  border:1px solid rgba(212,188,134,.48);
  text-shadow:none;
}
.person-row{
  display:grid;
  grid-template-columns:48px 1fr;
  gap:7px;
  font-size:.78rem;
  line-height:1.45;
  margin-bottom:5px;
}
.person-row .label{text-align:right;}
.person-row .label::before{
  display:inline-block;
  width:16px;
  margin-right:2px;
  text-align:center;
}
.p-loc::before{content:"📍";}
.p-dress::before{content:"👔";}
.p-act::before{content:"🕯️";}
.p-mind::before{content:"💭";}
.thought{color:var(--pm-blue);font-style:italic;}

.side-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.side-note{

[data-theme="dark"] .pm-diary .collapse-toggle,

(async function() {
  const hasAllVariables = typeof getAllVariables === 'function';
  const hasLodash = typeof _ !== 'undefined' && typeof _.get === 'function';
  let all_variables = {};
  if (hasAllVariables && hasLodash) {
    all_variables = getAllVariables();
  }

  function getVar(path, defaultValue) {
    return hasLodash ? _.get(all_variables, `stat_data.${path}`, defaultValue) : defaultValue;
  }

  function normalizePatchPath(path) {
    return String(path || '')
      .replace(/^\/+/, '')
      .split('/')
      .filter(Boolean)
      .map(part => part.replace(/~1/g, '/').replace(/~0/g, '~'))
      .join('/');
  }

  function getJsonPatchBlocks(messageText) {
    const blocks = [];
    const patchReg = /<JSONPatch>\s*([\s\S]*?)\s*<\/JSONPatch>/gi;
    let match;
    while ((match = patchReg.exec(messageText)) !== null) {
      blocks.push(match[1].trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, ''));
    }
    return blocks;
  }

  async function getCurrentUpdatedPaths() {
    try {
      if (typeof getCurrentMessageId !== 'function' || typeof getChatMessages !== 'function') {
        return new Set();
      }
      const currentMessageId = getCurrentMessageId();
      const messages = await getChatMessages(currentMessageId);
      const currentMessage = Array.isArray(messages) ? messages[0] : messages;
      const messageText = currentMessage && typeof currentMessage.message === 'string' ? currentMessage.message : '';
      const updatedPaths = new Set();
      getJsonPatchBlocks(messageText).forEach(block => {
        try {
          const patches = JSON.parse(block);
          if (!Array.isArray(patches)) return;
          patches.forEach(patch => {
            if (patch && typeof patch.path === 'string') {
              updatedPaths.add(normalizePatchPath(patch.path));
            }
          });
        } catch (e) {
          const pathReg = /"path"\s*:\s*"([^"]+)"/g;
          let pathMatch;
          while ((pathMatch = pathReg.exec(block)) !== null) {
            updatedPaths.add(normalizePatchPath(pathMatch[1]));
          }
        }
      });
      return updatedPaths;
    } catch (e) {
      console.error("读取当前楼层变量更新出错:", e);
      return new Set();
    }
  }

  function hasUpdatedPath(targetPath) {
    const target = normalizePatchPath(targetPath);
    if (!target) return false;
    for (const updatedPath of currentUpdatedPaths) {
      if (
        updatedPath === target ||
        updatedPath.startsWith(`${target}/`) ||
        target.startsWith(`${updatedPath}/`)
      ) {
        return true;
      }
    }
    return false;
  }

  function markMainPatchUpdate(id, type = 'text', targetPath) {
    const el = document.getElementById(id);
    if (!el) return;
    if (type === 'number') el.classList.add('main-number');
    if (!hasUpdatedPath(targetPath)) return;
    if (type === 'number') {
      el.classList.add('is-updated');
    } else if (type === 'box') {
      el.classList.add('main-updated-box', 'is-updated');
    } else {
      el.classList.add('main-updated-text', 'is-updated');
    }
  }

  const currentUpdatedPaths = await getCurrentUpdatedPaths();

  // 1. 填充主角状态栏
  try {
    const timeStr = getVar('主角状态栏.日期', '和平历10年/1月/1日 星期一');
    const timeParts = timeStr.split(' ');
    if(timeParts.length >= 2) {
      const dateParts = timeParts[0].split('/');
      if(dateParts.length >= 3) {
        document.getElementById('date-year').textContent = dateParts[0];
        const monthText = String(dateParts[1]).replace(/[月\s]/g, '');
        const dayText = String(dateParts[2]).replace(/[日\s]/g, '');
        document.getElementById('date-day').textContent = `${monthText}月 ${dayText}日`;
      } else {
        document.getElementById('date-day').textContent = timeParts[0];
      }
      document.getElementById('date-week').textContent = timeParts[1];
    } else {
      document.getElementById('date-day').textContent = timeStr;
    }

    document.getElementById('user-dress').textContent = getVar('主角状态栏.衣着', '校服');
    document.getElementById('user-status').textContent = getVar('主角状态栏.状态', '精神饱满');
    const moneyVal = getVar('主角状态栏.零花钱', 1000);
    const moneyEl = document.getElementById('user-money');
    if (moneyEl) { moneyEl.classList.add('main-number'); moneyEl.textContent = moneyVal + ' G'; }
    document.getElementById('user-personality').textContent = getVar('主角状态栏.叛逆乖巧说明', '中规中矩，既不惹事也不过分顺从。');

    const rebelVal = getVar('主角状态栏.叛逆乖巧数值', 0);
    const rebelText = rebelVal > 0 ? `+${rebelVal}` : rebelVal;
    const rebelEl = document.getElementById('user-rebel-text');
    if (rebelEl) { rebelEl.classList.add('main-number'); rebelEl.textContent = `✦ ${rebelText} ✦`; }
    const dotPos = 50 + (rebelVal / 2);
    document.getElementById('user-rebel-dot').style.left = `${Math.max(0, Math.min(100, dotPos))}%`;

    document.getElementById('course-am').textContent = getVar('主角状态栏.每日课程.上午', '文化课');
    document.getElementById('course-pm').textContent = getVar('主角状态栏.每日课程.下午', '社团活动');
    document.getElementById('course-night').textContent = getVar('主角状态栏.每日课程.夜间', '自习');

    const achievements = getVar('主角状态栏.成绩与成就', []);
    const achievementsHtml = achievements.map(a => `<span class="badge">${a}</span>`).join('');
    document.getElementById('achievements-list').innerHTML = achievementsHtml;

    document.getElementById('user-recent').textContent = getVar('主角状态栏.最近状态', '对新学期充满期待。');

    const stats = ['魅力', '艺术', '学术', '武力', '魔法'];
    const statIds = ['charm', 'art', 'academic', 'combat', 'magic'];
    stats.forEach((stat, index) => {
      const val = getVar(`主角状态栏.五维数值.${stat}`, 0);
      const valEl = document.getElementById(`stat-${statIds[index]}-val`);
      if (valEl) { valEl.classList.add('main-number'); valEl.textContent = val; }
      document.getElementById(`stat-${statIds[index]}-bar`).style.width = `${val}%`;
    });

    document.getElementById('fortune-stars').textContent = getVar('主角状态栏.每日运势.fortune-stars', '★★★☆☆');
    document.getElementById('fortune-text').textContent = getVar('主角状态栏.每日运势.fortune-text', '平平无奇的一天，顺其自然就好。');

    // 根据当前楼层 JSONPatch 标记本次被更新的变量
    [
      ['user-dress',       'text',   '主角状态栏/衣着'],
      ['user-status',      'text',   '主角状态栏/状态'],
      ['user-personality', 'text',   '主角状态栏/叛逆乖巧说明'],
      ['course-am',        'text',   '主角状态栏/每日课程/上午'],
      ['course-pm',        'text',   '主角状态栏/每日课程/下午'],
      ['course-night',     'text',   '主角状态栏/每日课程/夜间'],
      ['user-recent',      'text',   '主角状态栏/最近状态'],
      ['fortune-stars',    'text',   '主角状态栏/每日运势/fortune-stars'],
      ['fortune-text',     'text',   '主角状态栏/每日运势/fortune-text']
    ].forEach(([id, type, path]) => markMainPatchUpdate(id, type, path));

    [
      ['user-money',        'number', '主角状态栏/零花钱'],
      ['user-rebel-text',   'number', '主角状态栏/叛逆乖巧数值'],
      ['stat-charm-val',    'number', '主角状态栏/五维数值/魅力'],
      ['stat-art-val',      'number', '主角状态栏/五维数值/艺术'],
      ['stat-academic-val', 'number', '主角状态栏/五维数值/学术'],
      ['stat-combat-val',   'number', '主角状态栏/五维数值/武力'],
      ['stat-magic-val',    'number', '主角状态栏/五维数值/魔法']
    ].forEach(([id, type, path]) => markMainPatchUpdate(id, type, path));

    markMainPatchUpdate('achievements-list', 'box', '主角状态栏/成绩与成就');

  } catch (e) {
    console.error("填充主角状态栏出错:", e);
  }

  // 2. 填充固定十位男主状态栏
  try {
    const maleLeads = [
      { name: '魏月华', img: 'https://files.catbox.moe/g9u022.JPG' },
      { name: '秦述',   img: 'https://files.catbox.moe/ohc6ms.JPG' },
      { name: '司洛',   img: 'https://files.catbox.moe/tl4awe.JPG' },
      { name: '鹿言',   img: 'https://files.catbox.moe/ak2sos.JPG' },
      { name: '魏星泽', img: 'https://files.catbox.moe/b348lu.JPG' },
      { name: '周锦宁', img: 'https://files.catbox.moe/i0qmnn.JPG' },
      { name: '谌绪',   img: 'https://files.catbox.moe/4z2mgl.jpg' },
      { name: '孟明赫', img: 'https://files.catbox.moe/vym53w.JPG' },
      { name: '亓谢',   img: 'https://files.catbox.moe/f5l8yn.JPG' },
      { name: '桑洛凡', img: 'https://files.catbox.moe/6u61yt.JPG' }
    ];

    let maleLeadsHtml = '';
    maleLeads.forEach(lead => {
      const loc   = getVar(`固定十位男主状态栏.${lead.name}.地点`, '未知');
      const dress = getVar(`固定十位男主状态栏.${lead.name}.衣着`, '日常服装');
      const act   = getVar(`固定十位男主状态栏.${lead.name}.行为`, '无');
      const mind  = getVar(`固定十位男主状态栏.${lead.name}.心声`, '...');

      // 当前楼层 JSONPatch 涉及该男主任一字段则显示 NEW
      const updatedClass = ['地点', '衣着', '行为', '心声'].some(field =>
        hasUpdatedPath(`固定十位男主状态栏/${lead.name}/${field}`)
      ) ? ' is-updated' : '';

      maleLeadsHtml += `
        <div class="person-note${updatedClass}">
          <div class="person-avatar"><img src="${lead.img}" alt="${lead.name}"></div>
          <div class="person-content">
            <div class="person-name">${lead.name}</div>
            <div class="person-row"><span class="label p-loc">地点</span><span>${loc}</span></div>
            <div class="person-row"><span class="label p-dress">衣着</span><span>${dress}</span></div>
            <div class="person-row"><span class="label p-act">行为</span><span>${act}</span></div>
            <div class="person-row"><span class="label p-mind">心声</span><span class="thought">${mind}</span></div>
          </div>
        </div>
      `;
    });
    document.getElementById('male-leads-grid').innerHTML = maleLeadsHtml;
  } catch (e) {
    console.error("填充男主状态栏出错:", e);
  }

  // 3. 填充次要角色状态栏
  try {
    const sideChars = getVar('次要角色状态栏', {});
    const sideCharsKeys = Object.keys(sideChars);
    if (sideCharsKeys.length > 0) {
      document.getElementById('side-characters-section').style.display = 'block';
      let sideCharsHtml = '';
      sideCharsKeys.forEach(name => {
        const char = sideChars[name];
        sideCharsHtml += `
          <div class="side-note">
            <div class="side-head">
              <span class="side-name">${name}</span>
              <span class="side-role">${char.身份 || '未知'}</span>
            </div>
            <div class="side-row"><span class="label s-dress">衣着</span><span>${char.衣着 || '普通装扮'}</span></div>
            <div class="side-row"><span class="label s-act">行为</span><span>${char.行为 || '路过'}</span></div>
            <div class="side-row"><span class="label s-mind">心声</span><span class="side-thought">${char.心声 || '...'}</span></div>
          </div>
        `;
      });
      document.getElementById('side-characters-grid').innerHTML = sideCharsHtml;
    }
  } catch (e) {
    console.error("填充次要角色状态栏出错:", e);
  }

  // 主题切换
  const root = document.getElementById('diaryRoot');
  const btn  = document.getElementById('themeBtn');
  const savedTheme = localStorage.getItem('pmDiaryTheme');
  if (savedTheme) {
    root.setAttribute('data-theme', savedTheme);
    if(btn) btn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
  }
  if(btn){
    btn.addEventListener('click',(e)=>{
      e.preventDefault();
      e.stopPropagation();
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      btn.textContent = next === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('pmDiaryTheme', next);
    });
  }

  // 男主头像点击查看大图
  document.addEventListener("click",(e)=>{
    const img = e.target.closest(".person-avatar img");
    if(!img) return;
    const overlay = document.createElement("div");
    overlay.className = "pm-image-lightbox";
    overlay.style.cssText = `
      position:fixed;inset:0;background:rgba(0,0,0,.78);
      display:flex;align-items:center;justify-content:center;
      z-index:99999;backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);cursor:zoom-out;
    `;
    const bigImg = document.createElement("img");
    bigImg.src = img.src;
    bigImg.alt = img.alt || "角色头像";
    bigImg.style.cssText = `
      max-width:82vw;max-height:88vh;
      border-radius:18px;box-shadow:0 0 30px rgba(0,0,0,.45);
    `;
    overlay.appendChild(bigImg);
    overlay.addEventListener("click",()=>overlay.remove());
    document.body.appendChild(overlay);
  });
})();
</script>
</body>
</html>
