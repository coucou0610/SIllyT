<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        @import url("https://fontsapi.zeoseven.com/929/main/result.css");
    </style>
</head>
<body>
    <style>
        .pixel-quest-board {
            font-family: "Z Labs RoundPix 16px M CN", monospace;
            width: 100%;
            max-width: 500px;
            margin: 10px auto;
            padding: 9px 12px 10px;
            box-sizing: border-box;
            color: #2f2419;
            background:
                linear-gradient(180deg, rgba(255,255,255,0.32), rgba(120,75,30,0.05)),
                repeating-linear-gradient(135deg, #f3e2bd 0px, #f3e2bd 7px, #ead3a4 7px, #ead3a4 14px);
            border: 2px solid #8b5a2b;
            border-radius: 10px 3px 10px 3px;
            box-shadow:
                3px 3px 0 rgba(70,45,20,0.28),
                inset 0 0 0 1px rgba(255,245,220,0.75);
            position: relative;
            overflow: hidden;
            image-rendering: pixelated;
        }

        .pixel-quest-board::before {
            content: "";
            position: absolute;
            top: 5px;
            left: 8%;
            right: 8%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(196,154,69,0.75), transparent);
            pointer-events: none;
        }

        .pixel-quest-board::after {
            content: "◇";
            position: absolute;
            right: 10px;
            bottom: 5px;
            color: rgba(139,90,43,0.22);
            font-size: 1rem;
            pointer-events: none;
        }

        .pixel-content-wrapper {
            position: relative;
            z-index: 1;
        }

        .sys-quote-box {
            font-size: 0.78rem;
            line-height: 1.45;
            color: #6b5848;
            padding: 3px 0 6px;
            margin-bottom: 6px;
            border-bottom: 1px dashed rgba(139,90,43,0.45);
            display: flex;
            gap: 6px;
            align-items: flex-start;
        }

        .sys-quote-icon {
            color: #9b6b2f;
            flex-shrink: 0;
            animation: blink 1.6s steps(2, start) infinite;
        }

        @keyframes blink {
            to { visibility: hidden; }
        }

        .quest-title {
            display: inline-block;
            font-size: 0.92rem;
            line-height: 1.35;
            color: #7a3b28;
            text-shadow: 1px 1px 0 rgba(255,245,220,0.85);
            margin-bottom: 6px;
            word-break: break-word;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .quest-title::before {
            content: "◇ 系统任务：";
            color: #9b6b2f;
        }

        .quest-details {
            display: grid;
            grid-template-columns: 1fr;
            gap: 4px;
            font-size: 0.8rem;
        }

        .detail-row {
            display: flex;
            align-items: flex-start;
            gap: 4px;
            line-height: 1.45;
        }

        .detail-label {
            color: #6e4a25;
            white-space: nowrap;
            flex-shrink: 0;
            text-shadow: 1px 1px 0 rgba(255,245,220,0.65);
        }

        .detail-value {
            flex: 1;
            word-break: break-word;
        }

        .highlight-cmd {
            color: #2f6d72;
        }

        .highlight-rwd {
            color: #3f7a4c;
        }

        .highlight-pnl {
            color: #9b3b35;
        }

        @media (min-width: 520px) {
            .quest-details {
                grid-template-columns: 1fr 1fr;
                column-gap: 10px;
            }

            .detail-row:first-child {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 420px) {
            .pixel-quest-board {
                max-width: calc(100% - 10px);
                padding: 8px 10px 9px;
            }

            .sys-quote-box {
                font-size: 0.74rem;
            }

            .quest-title {
                font-size: 0.84rem;
            }

            .quest-details {
                font-size: 0.74rem;
            }
        }
    </style>

    <div class="pixel-quest-board">
        <div class="pixel-content-wrapper">
            <div class="sys-quote-box">
                <span class="sys-quote-icon">▸</span>
                <span>$1</span>
            </div>

            <div class="quest-title">$2</div>

            <div class="quest-details">
                <div class="detail-row">
                    <span class="detail-label">指令：</span>
                    <span class="detail-value highlight-cmd">$3</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">成功奖励：</span>
                    <span class="detail-value highlight-rwd">$4</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">失败惩罚：</span>
                    <span class="detail-value highlight-pnl">$5</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
