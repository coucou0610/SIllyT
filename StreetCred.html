<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博朋克 2077 · 街头声望状态栏</title>
    <!-- 引入与之前统一的字体 -->
    <style>
        @import url("https://fontsapi.zeoseven.com/10/main/result.css");
    </style>
</head>
<body>
    <style>
        /* 完全继承和复用之前的配色与字体变量 */
        :root {
            --font-main: "WenQuanYi Bitmap Song 16px", "Microsoft YaHei", sans-serif;
            --color-primary-yellow: #FFD60A;
            --color-secondary-cyan: #00E5FF;
            --color-accent-magenta: #F50057;
            --color-background-dark: #0d0d1a;
            --color-background-medium: #1a1a2b;
            --color-text-light: #e0e0e0;
        }

        /* 容器样式，与时间地点栏保持完全一致，确保并排时和谐 */
        .cred-statusbar-container {
            font-family: var(--font-main);
            width: 100%;
            max-width: 800px;
            margin: 0 auto 10px auto;
            padding: 0;
            background: transparent;
            position: relative;
        }

        /* 内容区域样式，视觉风格统一 */
        .cred-statusbar-content {
            border: 1px solid var(--color-primary-yellow);
            background: linear-gradient(145deg, rgba(13, 13, 26, 0.9), rgba(26, 26, 43, 0.9));
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 0 8px var(--color-primary-yellow), 0 0 15px var(--color-accent-magenta), inset 0 0 5px rgba(0, 229, 255, 0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column; /* 改为垂直布局以容纳进度条 */
            gap: 8px;
            padding: 10px 15px;
        }

        .cred-info-line {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            width: 100%;
        }

        .cred-label {
            color: var(--color-secondary-cyan);
            font-weight: normal;
            font-size: 0.9em;
            flex-shrink: 0;
            margin-right: 10px;
        }

        .cred-label::before {
            content: '//:';
            color: var(--color-accent-magenta);
            margin-right: 4px;
        }

        .cred-rank {
            color: var(--color-primary-yellow);
            font-weight: normal;
            font-size: 1em;
            text-shadow: 0 0 3px var(--color-primary-yellow);
            text-align: right;
            white-space: nowrap;
        }

        /* 进度条容器 */
        .cred-progress-bar-container {
            width: 100%;
            height: 10px; /* 进度条高度 */
            background-color: rgba(0, 0, 0, 0.5); /* 进度条背景色 */
            border: 1px solid var(--color-secondary-cyan);
            padding: 1px;
            overflow: hidden;
            position: relative;
        }

        /* 进度条填充部分 */
        .cred-progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--color-accent-magenta) 0%, var(--color-primary-yellow) 100%);
            box-shadow: 0 0 8px var(--color-primary-yellow);
            transition: width 0.5s ease-out; /* 平滑过渡效果 */
        }

        /* 进度条上的扫描线故障风效果 */
        .cred-progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                -45deg,
                rgba(255,255,255,0.2) 25%,
                transparent 25%,
                transparent 50%,
                rgba(255,255,255,0.2) 50%,
                rgba(255,255,255,0.2) 75%,
                transparent 75%,
                transparent
            );
            z-index: 1;
            background-size: 20px 20px;
            animation: progress-glitch 0.5s linear infinite;
        }

        @keyframes progress-glitch {
            0% { background-position: 0 0; }
            100% { background-position: 20px 0; }
        }

    </style>

    <div class="cred-statusbar-container">
        <div class="cred-statusbar-content">
            <div class="cred-info-line">
                <span class="cred-label">STREET CRED</span>
                <span id="credRank" class="cred-rank">...</span>
            </div>
            <div class="cred-progress-bar-container">
                <div id="credProgressBar" class="cred-progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // 获取声望值，即正则表达式捕获的第一个组($1)
            const credValue = parseInt('$1', 10);

            const rankElement = document.getElementById('credRank');
            const progressBarElement = document.getElementById('credProgressBar');

            if (isNaN(credValue) || !rankElement || !progressBarElement) {
                // 如果数据无效或元素不存在，则不执行
                return;
            }

            let rankName = "";
            let progressPercentage = 0;
            const maxVisualCred = 1500; // 进度条视觉上的最大值

            // 根据声望值决定等级名称
            if (credValue < 100) {
                rankName = `无名之辈 (${credValue}/100)`;
            } else if (credValue < 300) {
                rankName = `崭露头角 (${credValue}/300)`;
            } else if (credValue < 600) {
                rankName = `小有名气 (${credValue}/600)`;
            } else if (credValue < 1000) {
                rankName = `可靠雇佣兵 (${credValue}/1000)`;
            } else if (credValue < 1500) {
                rankName = `都市传说 (${credValue}/1500)`;
            } else {
                rankName = `夜城传奇 (+${credValue - maxVisualCred})`; // 显示超出部分
            }

            // 计算进度条百分比
            // 即使数值超过1500，进度条也只显示为100%
            progressPercentage = Math.min((credValue / maxVisualCred) * 100, 100);

            // 更新界面
            rankElement.textContent = rankName;
            progressBarElement.style.width = progressPercentage + '%';
        })();
    </script>
</body>
</html>
